name: deploy to aws

on:
  push:
    branches: [main]

concurrency:
  group: deploy-to-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
           ${{ secrets.DOCKER_USERNAME }}/oims-app:latest
           ${{ secrets.DOCKER_USERNAME }}/oims-app:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESSKEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_ACCESS_REGION }}

      - name: Deploy to AWS by refreshing ASG
        run: |
          echo "Checking for existing instance refresh..."

          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${{ secrets.ASG_NAME }}" \
              --max-records 1 \
              --query 'InstanceRefreshes[0].Status' \
              --output text)
            echo "Current instance refresh status: $STATUS"
            if [[ "$STATUS" == "InProgress" || "$STATUS" == "Pending" ]]; then
              echo "An instance refresh is already in progress. Waiting for it to complete..."
              sleep 30
            else
              echo "No instance refresh in progress. Proceeding with the new instance refresh."
              break
            fi
          done
          echo "Starting a new instance refresh..."

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${{ secrets.ASG_NAME }}" \
            --preferences '{"MinHealthyPercentage":0,"InstanceWarmup":30}'
